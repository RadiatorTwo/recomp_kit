[package]
name = "mygame"
description = "GAMETITLE recompiled to native code"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# the framework, copied from recomp_kit into crates/ (this game's own copy, change it freely)
recomp = { path = "crates/recomp" }
win32 = { path = "crates/win32" }

[workspace]
resolver = "3"
members = [".", "crates/recomp", "crates/win32", "crates/tools"]

# KIT_WORKSPACE (new-game.ps1 puts recomp_kit's [workspace.package] and
# [workspace.dependencies] here)

[features]
# test-only debug commands, never in a release: cargo build --release --features cheats
cheats = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

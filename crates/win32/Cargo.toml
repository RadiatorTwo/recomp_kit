[package]
name = "win32"
description = "Windows and DirectX layer for games recompiled with recomp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
recomp = { path = "../recomp" }
iced-x86.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
winit = "0.30"
cpal = "0.18.2"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.18.0"
raw-window-handle = "0.6"
gilrs = "0.11.2"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

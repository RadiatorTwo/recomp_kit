[workspace]
resolver = "3"
members = ["crates/recomp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
